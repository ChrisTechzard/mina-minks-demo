name: Deploy frontend to GitHub Pages

# Static presentation fallback only. Render remains the primary deployment and
# is not touched by this workflow. No secrets are stored in this repository.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static demo
        working-directory: frontend
        env:
          VITE_BASE_PATH: /mina-minks-demo/
          VITE_API_URL: https://mina-minks-demo-api-1xa7.onrender.com
        run: npm run build

      - name: Add SPA fallback for direct links
        run: cp dist/index.html dist/404.html
        working-directory: frontend

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
