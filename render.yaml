# Free-tier Render blueprint for the independent Mina Minks demo.
# Static frontend + FastAPI web service + Render Postgres (free plan).
# No secrets are stored here: ADMIN_PASSWORD is prompted in the Render dashboard
# and DATABASE_URL is injected from the managed database.
databases:
  - name: mina-minks-demo-db
    plan: free
    region: oregon
    postgresMajorVersion: '17'

services:
  - type: web
    name: mina-minks-demo-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: ENVIRONMENT
        value: demo
      - key: DATABASE_URL
        fromDatabase:
          name: mina-minks-demo-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://mina-minks-demo-web.onrender.com
      - key: ADMIN_EMAIL
        value: demo.admin@example.com
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: mina-minks-demo-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_URL
        value: https://mina-minks-demo-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
